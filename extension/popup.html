<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PhishGuard</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; font-family: 'JetBrains Mono', monospace, system-ui; background: #0a0e1a; color: #e0e6ed; }
      h1 { margin: 0 0 12px; font-size: 14px; color: #00e5ff; }
      .url { font-size: 11px; word-break: break-all; color: #8a9099; margin-bottom: 12px; }
      .score { font-size: 36px; font-weight: 700; text-align: center; padding: 16px; border-radius: 8px; margin-bottom: 4px; }
      .safe { background: rgba(46,204,113,0.15); color: #2ecc71; }
      .suspicious { background: rgba(243,156,18,0.15); color: #f39c12; }
      .dangerous { background: rgba(231,76,60,0.15); color: #e74c3c; }
      .level { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin: 4px 0 12px; color: #8a9099; }
      .indicator { font-size: 10px; padding: 4px 6px; margin: 2px 0; border-radius: 4px; background: rgba(231,76,60,0.1); color: #e74c3c; }
      .footer { margin-top: 12px; font-size: 9px; color: #5a6068; text-align: center; }
    </style>
  </head>
  <body>
    <h1>🛡 PhishGuard</h1>
    <div class="url" id="url">Loading…</div>
    <div class="score" id="score">--</div>
    <div class="level" id="level"></div>
    <div id="indicators"></div>
    <div class="footer">Heuristic + RF model · v1.0.0</div>
    <script src="popup.js"></script>
  </body>
</html>
